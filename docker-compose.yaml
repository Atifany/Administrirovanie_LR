services:
  web:
    build: .
    image: admin_lr3
    container_name: admin_lr3
    ports:
      - "8081:80"
    volumes:
      - ./html:/usr/share/nginx/html:ro
    depends_on:
      - php

  php:
    image: php:8.3-fpm-alpine
    container_name: admin_lr3_php
    volumes:
      - ./html:/usr/share/nginx/html:ro